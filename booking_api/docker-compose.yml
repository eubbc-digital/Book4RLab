version: "3"

services:
  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: ${RESTART_POLICY}
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    env_file: .env
    extra_hosts:
      # Keycloak host from KEYCLOAK_URL: eeda.iotecbol.com in production, eeda.localtest.me in dev
      - "${KEYCLOAK_HOST:-eeda.iotecbol.com}:host-gateway"
    depends_on:
      - db
    restart: ${RESTART_POLICY}
volumes:
  postgres_data:
