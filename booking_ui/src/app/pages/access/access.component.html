<div class="main-container">
  <mat-card class="card">
    <mat-card-title class="title">{{ title }}</mat-card-title>
    <mat-card-content class="access-content">
      <p class="access-description">
        Sign in with your UPB account. New users can create an account and verify their email.
      </p>
      <button class="access-button" type="button" mat-raised-button color="primary" (click)="signIn()">
        Sign in with EEDA SSO
      </button>
      <button class="access-button" type="button" mat-stroked-button color="primary" (click)="signUp()">
        Create account
      </button>
      <p id="eeda-tools-link" class="mat-caption">
        <a href="https://eeda.iotecbol.com/" target="_blank">
          EEDA Tools
        </a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
